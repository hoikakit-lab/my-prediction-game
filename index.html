<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Market - 自由預測市集</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#121214',
                            950: '#0a0a0c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- 引入高質感中文字體 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        /* 套用新字體與基礎樣式 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0a0a0c;
            color: #f3f4f6;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 (Sticky Header) -->
    <header class="sticky top-0 z-40 bg-dark-950/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-chart-line text-white text-lg"></i>
                </div>
                <span class="font-black text-lg tracking-wider bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
                    NEXUS MARKET
                </span>
            </div>

            <!-- 用戶資產與狀態區 -->
            <div class="flex items-center space-x-3">
                <div class="hidden sm:flex items-center space-x-2 bg-gray-900/80 border border-white/10 px-3 py-1.5 rounded-full text-sm">
                    <i class="fa-solid fa-coins text-amber-400"></i>
                    <span id="userBalance" class="font-bold text-amber-400">1,000</span>
                    <span class="text-xs text-gray-400">代幣</span>
                </div>
                <button onclick="openCheckinModal()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-3.5 py-1.5 rounded-full text-xs font-bold transition shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-calendar-check mr-1"></i> 每日簽到
                </button>
                <div id="userAuthArea" class="flex items-center">
                    <!-- 動態登入狀態 -->
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- 賽季倒數與狀態橫幅 -->
        <section class="bg-gradient-to-r from-indigo-950/60 via-purple-950/40 to-dark-900/80 border border-white/10 p-6 rounded-2xl shadow-xl backdrop-blur-md relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative z-10">
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">Season 1</span>
                    <h1 class="text-2xl sm:text-3xl font-black mt-2 tracking-tight">自由預測市集</h1>
                    <p class="text-xs sm:text-sm text-gray-400 mt-1">預測未來趨勢，賺取最高榮譽與代幣獎勵。</p>
                </div>
                <div class="flex items-center space-x-4 bg-dark-900/90 border border-white/10 px-4 py-3 rounded-xl">
                    <div class="text-center">
                        <div id="seasonTimer" class="font-mono text-xl font-bold text-indigo-400">--:--:--</div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider">距離賽季結算</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 分類導航與題目列表 -->
        <div class="space-y-4">
            <div class="flex overflow-x-auto space-x-2 pb-2 scrollbar-none">
                <button onclick="switchCategory('all')" id="cat-all" class="category-btn px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition shadow-md shadow-indigo-600/20">全部題目</button>
                <button onclick="switchCategory('crypto')" id="cat-crypto" class="category-btn px-4 py-2 rounded-xl text-sm font-bold bg-gray-900/80 text-gray-400 border border-white/5 hover:border-white/20 transition">加密貨幣</button>
                <button onclick="switchCategory('tech')" id="cat-tech" class="category-btn px-4 py-2 rounded-xl text-sm font-bold bg-gray-900/80 text-gray-400 border border-white/5 hover:border-white/20 transition">科技趨勢</button>
                <button onclick="switchCategory('gaming')" id="cat-gaming" class="category-btn px-4 py-2 rounded-xl text-sm font-bold bg-gray-900/80 text-gray-400 border border-white/5 hover:border-white/20 transition">電競娛樂</button>
            </div>

            <!-- 題目動態渲染容器 -->
            <div id="marketContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 範例空白狀態：當沒有題目時顯示 -->
                <div class="col-span-full bg-gray-900/50 border border-white/5 p-12 rounded-2xl text-center flex flex-col items-center justify-center">
                    <span class="text-4xl mb-3 opacity-50">📭</span>
                    <p class="text-gray-400 font-medium">此分類目前沒有進行中的預測題目</p>
                    <p class="text-xs text-gray-500 mt-1">快來搶下首發，成為第一個發起對賭的人！</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 每日簽到彈窗 (帶有毛玻璃與淡入放大動畫) -->
    <div id="checkinModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-gray-900/95 border border-white/10 w-full max-w-sm p-6 rounded-2xl shadow-[0_0_50px_rgba(16,185,129,0.15)] relative text-center transform scale-95 transition-transform duration-300">
            <button onclick="closeCheckinModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
                <i class="fa-solid fa-gift text-xl"></i>
            </div>
            <h3 class="text-lg font-bold">每日簽到獎勵</h3>
            <p class="text-xs text-gray-400 mt-1 mb-6">連續簽到可獲得更多代幣，每天都能領取一次！</p>
            <button onclick="claimCheckin()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-900/40">
                立即領取 +50 代幣
            </button>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="border-t border-white/5 py-6 mt-12 text-center text-xs text-gray-500">
        <p>&copy; 2026 Nexus Market. All rights reserved.</p>
    </footer>

    <!-- JavaScript 互動邏輯 -->
    <script>
        // 彈窗控制邏輯（含流暢動畫）
        function openCheckinModal() {
            const modal = document.getElementById('checkinModal');
            modal.classList.remove('hidden');
            modal.classList.flex; // 確保 flex 生效
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function closeCheckinModal() {
            const modal = document.getElementById('checkinModal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function claimCheckin() {
            alert('成功領取 50 代幣！');
            closeCheckinModal();
        }

        function switchCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-4 py-2 rounded-xl text-sm font-bold bg-gray-900/80 text-gray-400 border border-white/5 hover:border-white/20 transition";
            });
            const activeBtn = document.getElementById(`cat-${category}`);
            if(activeBtn) {
                activeBtn.className = "category-btn px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition shadow-md shadow-indigo-600/20";
            }
        }
    </script>
</body>
</html>
