<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由預測市集</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <!-- 引入 Animate.css 輔助微互動與過場動畫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide text-brand-500">🎯 自由預測市集</h1>
            <div class="flex items-center space-x-3">
                <!-- 網路狀態指示器 -->
                <div id="network-status" class="hidden text-xs px-2 py-1 rounded bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400">
                    網路離線
                </div>
                <!-- 深色模式切換按鈕 -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <!-- 離線警告橫幅 -->
    <div id="offline-banner" class="hidden bg-amber-500 text-white text-center text-xs py-1 transition-all">
        目前網路連線中斷，部分資料可能無法同步。
    </div>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- 表單送出區 (包含防手殘機制) -->
        <section class="bg-white dark:bg-gray-900 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6">
            <h2 class="text-md font-semibold mb-3">發布新預測</h2>
            <form id="prediction-form" onsubmit="handleFormSubmit(event)">
                <div class="mb-3">
                    <label class="block text-xs font-medium mb-1 text-gray-500 dark:text-gray-400">預測題目</label>
                    <input type="text" id="pred-title" required 
                           class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-brand-500 transition"
                           placeholder="例如：今天結束前比特幣會突破特定價位嗎？">
                </div>
                <button type="submit" id="submit-btn" 
                        class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-lg text-sm shadow-md transition duration-200 transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    確認發布
                </button>
            </form>
        </section>

        <!-- 數據列表區 (結合骨架屏) -->
        <section>
            <h2 class="text-md font-semibold mb-3">市場列表</h2>
            <!-- 骨架屏載入樣式 -->
            <div id="skeleton-loader" class="space-y-3">
                <div class="p-4 bg-white dark:bg-gray-900 rounded-xl shadow-sm animate-pulse flex flex-col space-y-2">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
                </div>
                <div class="p-4 bg-white dark:bg-gray-900 rounded-xl shadow-sm animate-pulse flex flex-col space-y-2">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-2/3"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
                </div>
            </div>
            
            <!-- 真實資料渲染容器 -->
            <div id="prediction-list" class="space-y-3 hidden">
                <!-- 動態生成的預測卡片會在這裡插入 -->
            </div>
        </section>
    </main>

    <!-- 浮動提示 Toast (取代傳統 alert) -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toast-msg" class="px-4 py-3 rounded-lg shadow-lg text-sm font-medium bg-gray-900 text-white dark:bg-white dark:text-gray-900">
            提示訊息
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-100 dark:border-gray-800">
        &copy; 2026 自由預測市集 All Rights Reserved.
    </footer>

    <!-- JavaScript 邏輯實作 -->
    <script>
        // 1. 深色模式切換
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        // 初始化載入記錄的 Theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // 2. 顯示 Toast 提示函數
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            
            // 依據類型調整樣式
            if(type === 'error') {
                toastMsg.className = "px-4 py-3 rounded-lg shadow-lg text-sm font-medium bg-red-600 text-white";
            } else {
                toastMsg.className = "px-4 py-3 rounded-lg shadow-lg text-sm font-medium bg-gray-900 text-white dark:bg-white dark:text-gray-900";
            }

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // 3. 網路狀態監聽
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            const isOnline = navigator.onLine;
            const banner = document.getElementById('offline-banner');
            const indicator = document.getElementById('network-status');
            if (!isOnline) {
                banner.classList.remove('hidden');
                indicator.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
                indicator.classList.add('hidden');
            }
        }

        // 4. 表單防手殘與送出控制
        function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const titleInput = document.getElementById('pred-title');
            const titleValue = titleInput.value.trim();

            if (!titleValue) return;

            // 進入防手殘鎖定狀態
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中...';

            // 模擬非同步寫入資料庫 (此處可替換為您的 Firebase 寫入邏輯)
            setTimeout(() => {
                showToast('預測題目發布成功！');
                titleInput.value = '';
                
                // 恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.innerText = '確認發布';

                // 重新載入列表（示範動態插入）
                appendNewCard(titleValue);
            }, 1000);
        }

        // 5. 模擬從資料庫載入資料並切換骨架屏
        window.addEventListener('DOMContentLoaded', () => {
            updateNetworkStatus();
            
            // 模擬網路延遲讀取資料
            setTimeout(() => {
                document.getElementById('skeleton-loader').classList.add('hidden');
                const listContainer = document.getElementById('prediction-list');
                listContainer.classList.remove('hidden');
                
                // 載入預設假資料
                listContainer.innerHTML = `
                    <div class="p-4 bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 transition hover:shadow-md">
                        <p class="font-medium text-sm mb-1">本週台股指數會站穩特定點位嗎？</p>
                        <span class="text-xs text-brand-500 font-semibold bg-brand-500/10 px-2 py-0.5 rounded">進行中</span>
                    </div>
                `;
            }, 1200); // 模擬 1.2 秒的讀取時間
        });

        function appendNewCard(title) {
            const listContainer = document.getElementById('prediction-list');
            listContainer.classList.remove('hidden');
            const newCard = document.createElement('div');
            newCard.className = "p-4 bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 transition hover:shadow-md animate__animated animate__fadeIn";
            newCard.innerHTML = `
                <p class="font-medium text-sm mb-1">${title}</p>
                <span class="text-xs text-brand-500 font-semibold bg-brand-500/10 px-2 py-0.5 rounded">剛剛發布</span>
            `;
            listContainer.prepend(newCard);
        }
    </script>
</body>
</html>
